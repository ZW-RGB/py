  <div class="article">
    <h1>关于促进医养结合发展的指导意见</h1>
    <div class="meta">
      <span class="doc-number">国办发〔2024〕15号</span>
      <span class="date">发布日期：2024-05-12</span>
      <span class="authority">国务院办公厅</span>
      <span class="category">养老服务</span>
    </div>
    <div class="summary">
      为积极应对人口老龄化，推进医疗卫生与养老服务深度融合，更好满足老年人健康养老服务需求，现就促进医养结合发展提出以下意见。
      推动医疗卫生服务延伸至社区、家庭，支持养老机构内设医疗机构，鼓励社会力量举办医养结合机构。
    </div>
    <p class="content">
      医养结合是积极应对人口老龄化的重要举措。各地区、各部门要充分认识推进医养结合发展的重要意义，切实加强组织领导，
      将医养结合工作纳入经济社会发展规划和深化医药卫生体制改革总体部署，建立健全部门协作机制，形成工作合力。
    </p>
    <p class="keywords">关键词：医养结合,养老服务,人口老龄化,社区医疗</p>
  </div>
